name: Job Radar AI - Scheduled Digest

on:
  schedule:
    # Her gün Türkiye saatiyle 09:00 (UTC 06:00) ve 18:00 (UTC 15:00)
    - cron: '0 6,15 * * *'
  workflow_dispatch: # Manuel tetikleme butonu

jobs:
  run-job-radar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Job Finder & Digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          GOOGLE_SHEETS_ENABLED: ${{ secrets.GOOGLE_SHEETS_ENABLED || 'false' }}
        run: |
          python main.py --run-once

      - name: Commit and Push DB Updates (Deduplication Persistence)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jobs.db data/jobs_export.csv || true
          git commit -m "chore: update seen jobs database [skip ci]" || echo "No changes to commit"
          git push || echo "Push failed or nothing to push"
